---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: pickle-scan-oci-ta
  annotations:
    tekton.dev/pipelines.minVersion: 0.12.1
    tekton.dev/tags: pickle, security, konflux
  labels:
    app.kubernetes.io/version: 0.1.2
spec:
  description: Scans OCI artifacts and AI model files for malicious pickle
    files using picklescan. Uses trusted artifacts for source data. Pickle
    files are commonly used for Python/ML model serialization and can contain
    arbitrary code execution payloads.
  params:
    - name: EXTRA_ARTIFACT_FILTER
      description: Extended regex matching org.opencontainers.image.title
        paths in the OCI manifest when FETCH_EXTRA_ARTIFACTS=true.
      type: string
      default: (^|/)[^/]+\.(pkl|pickle|pt|pth|bin|ckpt|joblib)$
    - name: FETCH_EXTRA_ARTIFACTS
      description: When "true", fetch pickle-like files from image-url@image-digest
        (OCI artifact manifest) into /var/workdir/source alongside the restored
        SOURCE_ARTIFACT. Skipped for standard container images.
      type: string
      default: "false"
    - name: SOURCE_ARTIFACT
      description: The Trusted Artifact URI pointing to the artifact with
        the application source code.
      type: string
    - name: ca-trust-config-map-key
      description: The name of the key in the ConfigMap that contains the
        CA bundle data.
      type: string
      default: ca-bundle.crt
    - name: ca-trust-config-map-name
      description: The name of the ConfigMap to read CA bundle data from.
      type: string
      default: trusted-ca
    - name: image-digest
      description: Image digest to scan.
    - name: image-url
      description: Image URL.
    - name: skip-oci-attach-report
      description: If true, skips uploading the results to the image registry.
        Useful for read-only tests.
      type: string
      default: "false"
  results:
    - name: IMAGES_PROCESSED
      description: Images processed in the task.
    - name: TEST_OUTPUT
      description: Tekton task test output.
  volumes:
    - name: trusted-ca
      configMap:
        items:
          - key: $(params.ca-trust-config-map-key)
            path: ca-bundle.crt
        name: $(params.ca-trust-config-map-name)
        optional: true
    - name: workdir
      emptyDir: {}
  stepTemplate:
    volumeMounts:
      - mountPath: /etc/pki/tls/certs/ca-custom-bundle.crt
        name: trusted-ca
        readOnly: true
        subPath: ca-bundle.crt
      - mountPath: /var/workdir
        name: workdir
  steps:
    - name: use-trusted-artifact
      image: quay.io/konflux-ci/build-trusted-artifacts:latest@sha256:09c323a74915b57c3eeb28114820d0842e94779dec66bd9f645c959c5b2ea730
      args:
        - use
        - $(params.SOURCE_ARTIFACT)=/var/workdir/source
    - name: fetch-extra-artifacts
      image: quay.io/konflux-ci/build-trusted-artifacts:latest@sha256:09c323a74915b57c3eeb28114820d0842e94779dec66bd9f645c959c5b2ea730
      workingDir: /var/workdir
      env:
        - name: FETCH_EXTRA_ARTIFACTS
          value: $(params.FETCH_EXTRA_ARTIFACTS)
        - name: EXTRA_ARTIFACT_FILTER
          value: $(params.EXTRA_ARTIFACT_FILTER)
        - name: IMAGE_URL
          value: $(params.image-url)
        - name: IMAGE_DIGEST
          value: $(params.image-digest)
        - name: CA_FILE
          value: /etc/pki/tls/certs/ca-custom-bundle.crt
      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        if [[ "${FETCH_EXTRA_ARTIFACTS}" != "true" ]]; then
          exit 0
        fi

        if [[ -z "${IMAGE_URL}" || -z "${IMAGE_DIGEST}" ]]; then
          echo "INFO: image-url/image-digest missing, cannot fetch extra artifacts"
          exit 0
        fi

        declare -a oras_opts=()
        # shellcheck source=/dev/null
        source /usr/local/bin/oras_opts.sh

        IMAGE_REF="${IMAGE_URL}@${IMAGE_DIGEST}"
        echo "INFO: Fetching extra artifacts from OCI reference ${IMAGE_REF}"

        authfile="$(mktemp)"
        trap 'rm -f "${authfile}"' EXIT
        /usr/local/bin/select-oci-auth.sh "${IMAGE_URL}" >"${authfile}"

        retry oras manifest fetch "${oras_opts[@]}" --registry-config "${authfile}" "${IMAGE_REF}" >"/tmp/manifest.json"

        config_media_type="$(jq -r '.config.mediaType // ""' /tmp/manifest.json)"
        if [[ "${config_media_type}" == "application/vnd.oci.image.config.v1+json" ]] || [[ "${config_media_type}" == "application/vnd.docker.container.image.v1+json" ]]; then
          echo "INFO: Reference points to a container image config (${config_media_type}); skipping extra artifact fetch"
          exit 0
        fi

        mkdir -p /var/workdir/source

        fetched_count=0
        while IFS=$'\t' read -r digest rel_path; do
          [[ -n "${rel_path}" ]] || continue
          if ! printf '%s\n' "${rel_path}" | grep -Eq "${EXTRA_ARTIFACT_FILTER}"; then
            continue
          fi

          dest_path="/var/workdir/source/${rel_path}"
          resolved_dest="$(realpath -m "${dest_path}")"
          if [[ ! "${resolved_dest}" == /var/workdir/source/* ]]; then
            echo "WARN: Skipping path outside source root: ${rel_path}"
            continue
          fi

          mkdir -p "$(dirname "${resolved_dest}")"
          echo "INFO: Fetching blob ${digest} -> ${rel_path}"
          retry oras blob fetch "${oras_opts[@]}" --registry-config "${authfile}" "${IMAGE_URL}@${digest}" --output "${resolved_dest}"
          fetched_count=$((fetched_count + 1))
        done < <(jq -r '.layers[] | [.digest, (.annotations["org.opencontainers.image.title"] // "")] | @tsv' /tmp/manifest.json)

        if [[ "${fetched_count}" -eq 0 ]]; then
          echo "INFO: No files matched EXTRA_ARTIFACT_FILTER"
        else
          echo "INFO: Fetched ${fetched_count} extra artifact file(s) alongside SOURCE_ARTIFACT"
        fi
      computeResources:
        limits:
          memory: 2Gi
        requests:
          cpu: 100m
          memory: 512Mi
    - name: pickle-scan
      image: quay.io/konflux-ci/konflux-test:v1.5.4@sha256:dae74bf0d6fc349d3ae140d9e3a921ad5009fdf8dade3186bfd9b65fbe3a365b
      workingDir: /tekton/home
      env:
        - name: SOURCE_PATH
          value: /var/workdir/source
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        # shellcheck source=/dev/null
        . /utils.sh
        trap 'handle_error $(results.TEST_OUTPUT.path)' EXIT

        if [ ! -d "$SOURCE_PATH" ]; then
          note="Task $(context.task.name) failed: Source directory not found at $SOURCE_PATH."
          ERROR_OUTPUT=$(make_result_json -r "ERROR" -t "$note")
          echo "${ERROR_OUTPUT}" | tee "$(results.TEST_OUTPUT.path)"
          touch /tekton/home/pickle-scan-error
          exit 0
        fi

        echo "Running picklescan on $SOURCE_PATH"
        set +o pipefail
        picklescan --path "$SOURCE_PATH" 2>&1 | tee /tekton/home/picklescan-output.txt
        picklescan_exit=${PIPESTATUS[0]}
        set -o pipefail

        if [ "$picklescan_exit" -gt 1 ]; then
          note="Task $(context.task.name) failed: picklescan exited with code $picklescan_exit."
          ERROR_OUTPUT=$(make_result_json -r "ERROR" -t "$note")
          echo "${ERROR_OUTPUT}" | tee "$(results.TEST_OUTPUT.path)"
          touch /tekton/home/pickle-scan-error
          exit 0
        fi

        if [ ! -s /tekton/home/picklescan-output.txt ]; then
          note="Task $(context.task.name) failed: picklescan produced no output."
          ERROR_OUTPUT=$(make_result_json -r "ERROR" -t "$note")
          echo "${ERROR_OUTPUT}" | tee "$(results.TEST_OUTPUT.path)"
          touch /tekton/home/pickle-scan-error
          exit 0
        fi

        parse_picklescan_output /tekton/home/picklescan-output.txt >/tekton/home/picklescan-report.json

        if ! jq -e '.infected_files and .summary' /tekton/home/picklescan-report.json >/dev/null 2>&1; then
          note="Task $(context.task.name) failed: picklescan report is missing expected fields."
          ERROR_OUTPUT=$(make_result_json -r "ERROR" -t "$note")
          echo "${ERROR_OUTPUT}" | tee "$(results.TEST_OUTPUT.path)"
          touch /tekton/home/pickle-scan-error
          exit 0
        fi

        echo "Pickle scan report:"
        cat /tekton/home/picklescan-report.json

        if jq -e '.infected_files | length > 0' /tekton/home/picklescan-report.json >/dev/null 2>&1; then
          echo ""
          echo "WARNING: Infected files detected:"
          jq -r '.infected_files | to_entries[] | "  \(.key): \(.value)"' /tekton/home/picklescan-report.json
        fi
      computeResources:
        limits:
          cpu: 800m
          memory: 2Gi
        requests:
          cpu: 800m
          memory: 2Gi
      securityContext:
        capabilities:
          add:
            - SETFCAP
    - name: oci-attach-report
      image: quay.io/konflux-ci/task-runner:3.1.2@sha256:e272c1e1c60a4ecc72ff9c8d65bc48da534de6f1ce0d5aba79db3ac532d11c35
      workingDir: /tekton/home
      env:
        - name: SKIP_OCI_ATTACH_REPORT
          value: $(params.skip-oci-attach-report)
        - name: IMAGE_URL
          value: $(params.image-url)
        - name: IMAGE_DIGEST
          value: $(params.image-digest)
      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        if [ "$SKIP_OCI_ATTACH_REPORT" = "true" ]; then
          echo "OCI attach report skipped by parameter."
          exit 0
        fi

        if [ ! -f /tekton/home/picklescan-report.json ]; then
          echo "No pickle scan report found. Skipping upload."
          exit 0
        fi

        imagewithouttag=$(echo -n "$IMAGE_URL" | sed "s/\(.*\):.*/\1/")
        imageanddigest="${imagewithouttag}@${IMAGE_DIGEST}"

        mkdir -p /tmp/auth && select-oci-auth "${imageanddigest}" >/tmp/auth/config.json
        export DOCKER_CONFIG=/tmp/auth

        MEDIA_TYPE="application/vnd.redhat.pickle-scan-report+json"

        echo "Attaching pickle scan report to ${imageanddigest}"
        retry oras attach --no-tty --registry-config "/tmp/auth/config.json" \
          --artifact-type "${MEDIA_TYPE}" \
          "${imageanddigest}" \
          "picklescan-report.json:${MEDIA_TYPE}"
      computeResources:
        limits:
          cpu: 100m
          memory: 256Mi
        requests:
          cpu: 100m
          memory: 256Mi
    - name: evaluate-policy
      image: quay.io/konflux-ci/konflux-test:v1.5.4@sha256:dae74bf0d6fc349d3ae140d9e3a921ad5009fdf8dade3186bfd9b65fbe3a365b
      workingDir: /tekton/home
      env:
        - name: IMAGE_URL
          value: $(params.image-url)
        - name: IMAGE_DIGEST
          value: $(params.image-digest)
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        # shellcheck source=/dev/null
        . /utils.sh
        trap 'handle_error $(results.TEST_OUTPUT.path)' EXIT

        if [ -f /tekton/home/pickle-scan-error ]; then
          echo "Previous step failed. Preserving its TEST_OUTPUT."
          exit 0
        fi

        if [ ! -f /tekton/home/picklescan-report.json ]; then
          note="Task $(context.task.name) failed: No pickle scan report found."
          ERROR_OUTPUT=$(make_result_json -r "ERROR" -t "$note")
          echo "${ERROR_OUTPUT}" | tee "$(results.TEST_OUTPUT.path)"
          exit 0
        fi

        if ! jq -ce .summary /tekton/home/picklescan-report.json >/dev/null; then
          note="Task $(context.task.name) failed: Pickle scan report missing .summary field."
          ERROR_OUTPUT=$(make_result_json -r "ERROR" -t "$note")
          echo "${ERROR_OUTPUT}" | tee "$(results.TEST_OUTPUT.path)"
          exit 0
        fi

        # Use ec test (not conftest) so the rego policy drives TEST_OUTPUT directly,
        # matching the clamav-scan pattern and avoiding dead-code re-derivation from raw counts.
        # Note: this changes the TEST_OUTPUT shape from make_result_json to ec's appstudio format.
        EC_EXPERIMENTAL=1 ec test \
          --namespace required_checks \
          --policy /project/picklescan/virus-check.rego \
          -o appstudio \
          /tekton/home/picklescan-report.json | tee /tekton/home/picklescan-ec-test.json || true

        if [ ! -s /tekton/home/picklescan-ec-test.json ]; then
          note="Task $(context.task.name) failed: Policy evaluation did not produce output."
          TEST_OUTPUT=$(make_result_json -r "ERROR" -t "$note")
          echo "${TEST_OUTPUT}" | tee "$(results.TEST_OUTPUT.path)"
          exit 0
        fi

        jq -rce '.' /tekton/home/picklescan-ec-test.json | tee "$(results.TEST_OUTPUT.path)"

        echo '{"image": {"pullspec": "'"$IMAGE_URL"'", "digests": ["'"$IMAGE_DIGEST"'"]}}' | tee "$(results.IMAGES_PROCESSED.path)"
      computeResources:
        limits:
          cpu: 100m
          memory: 256Mi
        requests:
          cpu: 100m
          memory: 256Mi
